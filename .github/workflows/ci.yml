name: CI

on:
  push:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm run lint
      - name: unit tests
        run: pnpm test
      - name: production build
        run: pnpm run build
      # repo convention: dist/ is committed so `go run .` is one command —
      # fail if the committed build drifted from source
      - name: dist committed == fresh build
        run: |
          git diff --exit-code -- dist || {
            echo "::error::dist stale — run 'pnpm run build', commit it"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  backend:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: production build
        run: go build -trimpath -ldflags "-s -w" -o erd-creator .
      - uses: actions/upload-artifact@v4
        with:
          name: erd-creator-linux-amd64
          path: erd-creator

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: install chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: e2e against real server
        run: pnpm run e2e
