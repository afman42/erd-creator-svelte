name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# No job needs more than read access; nothing here writes to the repo.
permissions:
  contents: read

# Supersede in-flight runs for the same ref. PRs cancel (feedback loop);
# pushes to a branch do not, so a long verification is never cut in half.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm run lint
      - name: unit tests
        run: pnpm test
      - name: production build
        run: pnpm run build
      # repo convention: dist/ is committed so `go run .` is one command.
      # `git status --porcelain` is used rather than `git diff --exit-code`
      # because git diff only inspects TRACKED paths — it cannot see a new
      # untracked bundle, which is exactly how a stale index.html/bundle pair
      # slips through. This catches modified, deleted, and untracked.
      - name: dist committed == fresh build
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --porcelain -- dist
            echo "::error::dist stale or untracked — build and commit it"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: go test
        run: go test -count=1 ./...
      # The store is a concurrent HTTP server; race is cheap here (no deps).
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: production build
        run: go build -trimpath -ldflags "-s -w" -o erd-creator .
      - uses: actions/upload-artifact@v4
        with:
          name: erd-creator-linux-amd64
          path: erd-creator

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-go
      - run: pnpm install --frozen-lockfile
      # ~150MB of Chromium is re-downloaded every run otherwise. Keyed on the
      # lockfile so a Playwright bump busts it; restore-keys keeps a warm
      # fallback for the common case of unrelated dependency changes.
      # Only the browser download is cached — `--with-deps` apt packages
      # are not.
      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # "pw" == playwright; the prefix must match restore-keys exactly,
          # since restore-keys is a prefix match against cached keys.
          key: ${{ runner.os }}-pw-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pw-
      - name: install chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: e2e against real server
        run: pnpm run e2e
