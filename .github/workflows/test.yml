name: erd-creator-test
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: pnpm

      - name: Setup svelte-fork
        run: |
          cd ..
          if [ ! -d svelte-fork ]; then
            git clone -b svelte-custom-renderer https://github.com/tomyan/svelte.git svelte-fork
          fi
          cd svelte-fork && pnpm install 2>/dev/null || true
          pnpm -C packages/svelte build
          cd ../erd-creator

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: pnpm run build

      - name: Run unit tests
        run: |
          node src/lib/model.test.mjs
          node src/lib/sql.test.mjs
          node src/lib/edges.test.mjs
          node src/lib/export.test.mjs
          node src/lib/layout.test.mjs
          node src/lib/io.test.mjs

      - name: Run UI tests
        run: npx tui-test

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: tui-traces
          path: tui-traces/
          retention-days: 5
